<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Link Collector</title>
    <style>
      :root {
        color-scheme: light dark;
      }

      body {
        font-family: Arial, sans-serif;
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f5f7fb;
        color: #1f2937;
      }

      .card {
        width: min(92vw, 480px);
        background: white;
        border-radius: 16px;
        padding: 24px;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.1);
      }

      h1 {
        margin-top: 0;
        font-size: 1.6rem;
      }

      form {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      input {
        padding: 12px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        font-size: 1rem;
      }

      button {
        padding: 12px 14px;
        border: none;
        border-radius: 8px;
        background: #2563eb;
        color: white;
        font-size: 1rem;
        cursor: pointer;
      }

      button:hover {
        background: #1d4ed8;
      }

      .result-wrap {
        margin-top: 16px;
      }

      .result-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 8px;
      }

      .result {
        padding: 12px;
        border-radius: 8px;
        background: #eff6ff;
        word-break: break-all;
        white-space: pre-wrap;
      }

      .copy-btn {
        padding: 8px 10px;
        border: none;
        border-radius: 6px;
        background: #0f766e;
        color: white;
        font-size: 0.9rem;
        cursor: pointer;
      }

      .copy-btn:hover {
        background: #115e59;
      }

      .error {
        color: #b91c1c;
        background: #fef2f2;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Enter a link</h1>
      <form id="linkForm">
        <input id="linkInput" type="url" placeholder="https://example.com" required />
        <button type="submit">Save Link</button>
      </form>
      <div class="result-wrap">
        <div class="result-header">
          <strong>Output</strong>
          <button type="button" class="copy-btn" id="copyBtn">Copy</button>
        </div>
        <div id="result" class="result">Your link will appear here.</div>
      </div>
    </div>

    <script>
      const form = document.getElementById('linkForm');
      const input = document.getElementById('linkInput');
      const result = document.getElementById('result');
      const copyBtn = document.getElementById('copyBtn');

      form.addEventListener('submit', async function (event) {
        event.preventDefault();

        const value = input.value.trim();
        if (!value) {
          result.textContent = 'Please enter a valid link.';
          result.className = 'result error';
          return;
        }

        result.textContent = 'Processing your link...';
        result.className = 'result';

        try {
          const response = await fetch('/process-link', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ link: value })
          });

          const data = await response.json();

          if (!response.ok || !data.success) {
            throw new Error(data.error || 'Unable to process the link.');
          }

          const title = data.title ? `<strong>${data.title}</strong><br><br>` : '';
          result.innerHTML = `${title}${data.transcript}`;
        } catch (error) {
          result.textContent = error.message;
          result.className = 'result error';
        }
      });

      copyBtn.addEventListener('click', async function () {
        const textToCopy = result.innerText;
        if (!textToCopy || textToCopy === 'Your link will appear here.') {
          return;
        }

        try {
          await navigator.clipboard.writeText(textToCopy);
          copyBtn.textContent = 'Copied!';
          setTimeout(() => {
            copyBtn.textContent = 'Copy';
          }, 1200);
        } catch (error) {
          copyBtn.textContent = 'Failed';
          setTimeout(() => {
            copyBtn.textContent = 'Copy';
          }, 1200);
        }
      });
    </script>
  </body>
</html>
