<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Video Transcript Extractor</title>
    <style>
      :root {
        color-scheme: light dark;
      }

      body {
        font-family: Arial, sans-serif;
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f5f7fb;
        color: #1f2937;
      }

      .card {
        width: min(92vw, 480px);
        background: white;
        border-radius: 16px;
        padding: 24px;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.1);
      }

      h1 {
        margin-top: 0;
        font-size: 1.6rem;
      }

      p.subtitle {
        margin-top: -8px;
        margin-bottom: 16px;
        color: #6b7280;
        font-size: 0.9rem;
      }

      form {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      input {
        padding: 12px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        font-size: 1rem;
      }

      button {
        padding: 12px 14px;
        border: none;
        border-radius: 8px;
        background: #2563eb;
        color: white;
        font-size: 1rem;
        cursor: pointer;
      }

      button:hover:not(:disabled) {
        background: #1d4ed8;
      }

      button:disabled {
        background: #93c5fd;
        cursor: not-allowed;
      }

      .result-wrap {
        margin-top: 16px;
      }

      .result-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 8px;
      }

      .result {
        padding: 12px;
        border-radius: 8px;
        background: #eff6ff;
        word-break: break-word;
        white-space: pre-wrap;
        max-height: 320px;
        overflow-y: auto;
      }

      .copy-btn {
        padding: 8px 10px;
        border: none;
        border-radius: 6px;
        background: #0f766e;
        color: white;
        font-size: 0.9rem;
        cursor: pointer;
      }

      .copy-btn:hover:not(:disabled) {
        background: #115e59;
      }

      .copy-btn:disabled {
        background: #99f6e4;
        cursor: not-allowed;
      }

      .error {
        color: #b91c1c;
        background: #fef2f2;
      }

      .loading {
        color: #1d4ed8;
        background: #eff6ff;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Get a video transcript</h1>
      <p class="subtitle">Paste a YouTube or Instagram link below.</p>
      <form id="linkForm">
        <input
          id="linkInput"
          type="url"
          placeholder="https://www.youtube.com/watch?v=..."
          required
        />
        <button type="submit" id="submitBtn">Get Transcript</button>
      </form>
      <div class="result-wrap">
        <div class="result-header">
          <strong>Output</strong>
          <button type="button" class="copy-btn" id="copyBtn" disabled>Copy</button>
        </div>
        <div id="result" class="result">Your transcript will appear here.</div>
      </div>
    </div>

    <script>
      const form = document.getElementById('linkForm');
      const input = document.getElementById('linkInput');
      const result = document.getElementById('result');
      const copyBtn = document.getElementById('copyBtn');
      const submitBtn = document.getElementById('submitBtn');

      let currentTranscript = '';

      function setResult(text, className) {
        // textContent, never innerHTML — transcript text is untrusted content
        // and must never be parsed as HTML.
        result.textContent = text;
        result.className = 'result' + (className ? ' ' + className : '');
      }

      form.addEventListener('submit', async function (event) {
        event.preventDefault();

        const value = input.value.trim();
        if (!value) {
          setResult('Please enter a valid link.', 'error');
          return;
        }

        submitBtn.disabled = true;
        copyBtn.disabled = true;
        currentTranscript = '';
        setResult('Processing your link... this can take a little while for longer videos.', 'loading');

        try {
          const response = await fetch('/process-link', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ link: value })
          });

          const rawText = await response.text();
          let data;
          try {
            data = JSON.parse(rawText);
          } catch (parseErr) {
            // Show what actually came back instead of a generic message —
            // this makes it obvious whether it's an HTML error page, a
            // wrong-port response, an empty body, etc.
            const preview = rawText ? rawText.slice(0, 300) : '(empty response)';
            throw new Error(
              `Server did not return JSON (status ${response.status}). Raw response: ${preview}`
            );
          }

          if (!response.ok || !data.success) {
            throw new Error(data.error || 'Unable to process the link.');
          }

          const transcript = (data.transcript || '').trim();

          if (!transcript) {
            setResult('No transcript was returned for this link.', 'error');
            return;
          }

          currentTranscript = transcript;
          setResult(transcript, '');
          copyBtn.disabled = false;
        } catch (error) {
          setResult(error.message || 'Something went wrong. Please try again.', 'error');
        } finally {
          submitBtn.disabled = false;
        }
      });

      copyBtn.addEventListener('click', async function () {
        if (!currentTranscript) {
          return;
        }

        try {
          await navigator.clipboard.writeText(currentTranscript);
          copyBtn.textContent = 'Copied!';
        } catch (error) {
          copyBtn.textContent = 'Failed';
        } finally {
          setTimeout(() => {
            copyBtn.textContent = 'Copy';
          }, 1200);
        }
      });
    </script>
  </body>
</html>
